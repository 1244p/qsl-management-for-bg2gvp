name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  # 便于在网页上手动触发一次，验证 fork 的流水线是否可用
  workflow_dispatch:

jobs:
  ci:
    uses: halo-sigs/reusable-workflows/.github/workflows/plugin-ci.yaml@v4
    with:
      ui-path: "ui"
      pnpm-version: 10
      node-version: 24
      java-version: 21
